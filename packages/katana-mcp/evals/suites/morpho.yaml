# Morpho lending tools (13 total)
# Read tools use the Morpho API (Katana mainnet only) with an on-chain fallback;
# assertions on `source: "morpho-api"` catch a silent fall back to RPC.
# Market ID: vbETH/vbUSDC market with standard ERC20 tokens.

description: "Morpho lending tools (13 tools, 20 tests)"

providers:
  - id: mcp
    config:
      enabled: true
      server:
        command: node
        args: ["dist/server.js"]
        name: katana

# The build_* tools read on-chain. Run sequentially so the suite stays under
# public-RPC rate limits (set KATANA_RPC_URL to a keyed endpoint to go faster).
evaluateOptions:
  maxConcurrency: 1
  delay: 1000

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    timeout: 30000

tests:
  # ── list_morpho_markets ───────────────────────────────────────────────────
  - description: "list_morpho_markets — discover all markets"
    vars:
      prompt: '{"tool": "list_morpho_markets", "args": {"network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.network === 'mainnet'"
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); typeof o.totalMarkets === 'number'"
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); Array.isArray(o.markets) && o.markets.length > 0"
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          const m = o.markets[0];
          return !!(m.id && m.loanToken && m.collateralToken && m.lltv !== undefined);
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          const m = o.markets[0];
          return o.source === 'morpho-api'
            && typeof m.supplyUsd === 'number'
            && typeof m.supplyApy === 'string'
            && typeof m.listed === 'boolean'
            && Array.isArray(m.warnings)
            && o.markets.every((x, i, a) => i === 0 || (a[i - 1].supplyUsd ?? 0) >= (x.supplyUsd ?? 0));
    options:
      timeout: 120000

  - description: "list_morpho_markets — listedOnly returns only Morpho-listed markets"
    vars:
      prompt: '{"tool": "list_morpho_markets", "args": {"network": "mainnet", "listedOnly": true, "minSupplyUsd": 0}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.source === 'morpho-api' && o.markets.length > 0 && o.markets.every((m) => m.listed === true);

  # ── list_morpho_vaults ────────────────────────────────────────────────────
  - description: "list_morpho_vaults — discover all vaults"
    vars:
      prompt: '{"tool": "list_morpho_vaults", "args": {"network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); typeof o.totalVaults === 'number'"
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.totalVaults === 0) return true;
          const v = o.vaults[0];
          return v.address !== undefined && v.symbol !== undefined;
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.source === 'morpho-api'
            && o.v1Count > 0 && o.v2Count > 0
            && o.vaults.some((v) => v.version === 'v2')
            && o.vaults.every((v) => (v.version === 'v1' || v.version === 'v2') && Array.isArray(v.warnings));
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          // any vault reporting >100% net APY must carry the implausible-APY flag
          return o.vaults.every((v) => !v.netApy || parseFloat(v.netApy) <= 100 || v.warnings.some((w) => w.includes('implausible_apy')));
    options:
      timeout: 120000

  - description: "list_morpho_vaults — listedOnly returns only Morpho-listed vaults"
    vars:
      prompt: '{"tool": "list_morpho_vaults", "args": {"network": "mainnet", "listedOnly": true}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.source === 'morpho-api' && o.totalVaults > 0 && o.vaults.every((v) => v.listed === true);

  # ── get_morpho_vault_detail ───────────────────────────────────────────────
  - description: "get_morpho_vault_detail — v1 vault allocations from the API"
    vars:
      prompt: '{"tool": "get_morpho_vault_detail", "args": {"vault": "0x61D4F9D3797BA4dA152238c53a6f93Fb665C3c1d", "network": "mainnet"}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.source === 'morpho-api' && o.version === 'v1'
            && Array.isArray(o.allocations) && o.allocations.length > 0
            && o.withdrawalLiquidity && typeof o.listed === 'boolean';

  - description: "get_morpho_vault_detail — Vault V2 detected with adapters and caps"
    vars:
      prompt: '{"tool": "get_morpho_vault_detail", "args": {"vault": "0x5920A6FC553af799542EDA628AdfCc9eA52e141C", "network": "mainnet"}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.source === 'morpho-api' && o.version === 'v2'
            && Array.isArray(o.adapters) && Array.isArray(o.caps)
            && !!(o.withdrawalLiquidity && o.withdrawalLiquidity.percentOfTvl);

  # ── get_morpho_markets ────────────────────────────────────────────────────
  - description: "get_morpho_markets — fetch by ID"
    vars:
      prompt: '{"tool": "get_morpho_markets", "args": {"marketIds": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return !!(o.markets && o.markets[0] && o.markets[0].params && o.markets[0].state);
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          const m = o.markets[0];
          return m.source === 'morpho-api'
            && m.params.lltv === '86%'
            && typeof m.state.borrowApy === 'string'
            && typeof m.state.liquidity === 'string';

  # ── get_morpho_position ───────────────────────────────────────────────────
  - description: "get_morpho_position — zero position for random address"
    vars:
      prompt: '{"tool": "get_morpho_position", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "user": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.position !== undefined && o.market !== undefined;

  # ── analyze_loop_strategy ─────────────────────────────────────────────────
  - description: "analyze_loop_strategy — simulation with real quotes"
    vars:
      prompt: '{"tool": "analyze_loop_strategy", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "amount": "0.01", "loops": 2, "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.error) return true;
          return !!(o.market && o.summary);
    options:
      timeout: 60000

  # ── build_morpho_supply ───────────────────────────────────────────────────
  - description: "build_morpho_supply — targets Morpho core"
    vars:
      prompt: '{"tool": "build_morpho_supply", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "amount": "100", "onBehalf": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.to.toLowerCase() === '0xd50f2dfffd62f94ee4aed9ca05c61d0753268abc'"
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.chainId === 747474"
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.data.startsWith('0x')"

  # ── build_morpho_withdraw ─────────────────────────────────────────────────
  - description: "build_morpho_withdraw — targets Morpho core"
    vars:
      prompt: '{"tool": "build_morpho_withdraw", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "amount": "50", "onBehalf": "0x0000000000000000000000000000000000000001", "receiver": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.to.toLowerCase() === '0xd50f2dfffd62f94ee4aed9ca05c61d0753268abc'"
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.chainId === 747474"

  # ── build_morpho_borrow ───────────────────────────────────────────────────
  - description: "build_morpho_borrow — targets Morpho core"
    vars:
      prompt: '{"tool": "build_morpho_borrow", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "amount": "50", "onBehalf": "0x0000000000000000000000000000000000000001", "receiver": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.to.toLowerCase() === '0xd50f2dfffd62f94ee4aed9ca05c61d0753268abc'"
      - type: javascript
        value: "const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c); o.chainId === 747474"

  # ── build_morpho_authorize ────────────────────────────────────────────────
  - description: "build_morpho_authorize — returns valid status"
    vars:
      prompt: '{"tool": "build_morpho_authorize", "args": {"userAddress": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          return o.status === 'already_authorized' || o.status === 'authorization_required';
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          return o.morpho.toLowerCase() === '0xd50f2dfffd62f94ee4aed9ca05c61d0753268abc';
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          return o.adapter.toLowerCase() === '0x916aa175c36e845db45ff6ddb886ae437d403b61';

  - description: "build_morpho_authorize — returns tx when not authorized"
    vars:
      prompt: '{"tool": "build_morpho_authorize", "args": {"userAddress": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          if (o.status === 'already_authorized') return true;
          return !!(o.transaction && o.transaction.to && o.transaction.data.startsWith('0x'));

  # ── build_morpho_loop ─────────────────────────────────────────────────────
  - description: "build_morpho_loop — atomic leverage targets Bundler3"
    vars:
      prompt: '{"tool": "build_morpho_loop", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "userAddress": "0x0000000000000000000000000000000000000001", "amount": "0.01", "targetLeverage": 2.0, "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.error) return true;
          return o.transaction && o.transaction.to.toLowerCase() === '0xa8c5e23c9c0df2b6ff716486c6bbebb6661548c8';
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.error) return true;
          return !!(o.position && o.position.healthFactor);
    options:
      timeout: 60000

  # ── build_morpho_vault_deposit ────────────────────────────────────────────
  - description: "build_morpho_vault_deposit — targets vault with preview"
    vars:
      prompt: '{"tool": "build_morpho_vault_deposit", "args": {"vault": "0x61D4F9D3797BA4dA152238c53a6f93Fb665C3c1d", "amount": "100", "receiver": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: is-json
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return o.to.toLowerCase() === '0x61d4f9d3797ba4da152238c53a6f93fb665c3c1d'
            && o.chainId === 747474
            && o.data && o.data.startsWith('0x');
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          return !!(o.vault && o.asset && o.preview && o.preview.sharesReceived);
    options:
      timeout: 60000

  # ── build_morpho_vault_withdraw ───────────────────────────────────────────
  - description: "build_morpho_vault_withdraw — Vault V2 detected; no misleading max* values"
    vars:
      prompt: '{"tool": "build_morpho_vault_withdraw", "args": {"vault": "0x5920A6FC553af799542EDA628AdfCc9eA52e141C", "amount": "1", "mode": "withdraw", "receiver": "0xC6164Db338890e7A5E05D8a066C4aD54379C5a33", "owner": "0xC6164Db338890e7A5E05D8a066C4aD54379C5a33", "network": "mainnet"}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          return o.to.toLowerCase() === '0x5920a6fc553af799542eda628adfcc9ea52e141c'
            && o.vaultVersion === 'v2'
            && o.maxWithdrawable === null
            && ['ok', 'unknown'].includes(o.liquidityCheck);
    options:
      timeout: 60000

  - description: "build_morpho_vault_withdraw — withdrawal above balance is flagged by simulation"
    vars:
      prompt: '{"tool": "build_morpho_vault_withdraw", "args": {"vault": "0x5920A6FC553af799542EDA628AdfCc9eA52e141C", "amount": "100000", "mode": "withdraw", "receiver": "0xC6164Db338890e7A5E05D8a066C4aD54379C5a33", "owner": "0xC6164Db338890e7A5E05D8a066C4aD54379C5a33", "network": "mainnet"}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          if (o.liquidityCheck === 'unknown') return true; // simulation itself was rate-limited
          return o.liquidityCheck === 'reverts' && typeof o.note === 'string' && o.note.startsWith('WARNING');
    options:
      timeout: 60000

  - description: "build_morpho_vault_withdraw — vbUSDC amount encoded with 6 decimals (never a guessed 18)"
    vars:
      prompt: '{"tool": "build_morpho_vault_withdraw", "args": {"vault": "0x61D4F9D3797BA4dA152238c53a6f93Fb665C3c1d", "amount": "100", "mode": "withdraw", "receiver": "0x0000000000000000000000000000000000000001", "owner": "0x0000000000000000000000000000000000000001", "network": "mainnet"}}'
    assert:
      - type: javascript
        value: |
          const _c = JSON.parse(output); const o = JSON.parse(Array.isArray(_c) ? _c[0].text : _c);
          if (o.needsCustomRpc !== undefined) return true; // rate-limited: tool correctly returned RPC guidance
          // withdraw(uint256 assets, address receiver, address owner): first arg must be 100 * 10^6
          return o.vaultVersion === 'v1'
            && o.asset.decimals === 6
            && BigInt('0x' + o.data.slice(10, 74)) === 100000000n;
    options:
      timeout: 60000

  - description: "build_morpho_loop — excessive leverage returns error"
    vars:
      prompt: '{"tool": "build_morpho_loop", "args": {"marketId": "0x2fb14719030835b8e0a39a1461b384ad6a9c8392550197a7c857cf9fcbd6c534", "userAddress": "0x0000000000000000000000000000000000000001", "amount": "1", "targetLeverage": 50.0, "network": "mainnet"}}'
    assert:
      - type: javascript
        value: "output.toLowerCase().includes('error') || output.toLowerCase().includes('leverage')"
    options:
      timeout: 30000
